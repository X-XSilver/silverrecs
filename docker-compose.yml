# Satisfies:  tools to monitor and maintain the product, any services that crash try to restart if possible
services:
  frontend:
    build: ./frontend
    depends_on:
      - backend
    restart: unless-stopped
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    environment:
      - STEAM_API_KEY=${STEAM_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - FRONTEND_URL=${FRONTEND_URL}
      - API_URL=${API_URL}
      - DEV_MODE=${DEV_MODE}
